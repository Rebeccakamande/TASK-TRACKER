{% load static %}

<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>Task Tracker</title>


        <!-- Bootstrap -->

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >


        <!-- Bootstrap Icons -->

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        >


        <!-- Custom CSS -->

        <link
            rel="stylesheet"
            href="{% static 'tasks/css/style.css' %}"
        >

    </head>


    <body>


    <!-- ==============================
        NAVBAR
    ============================== -->

        <nav class="navbar">

            <div class="container py-2">

                <a
                    href="/"
                    class="navbar-brand text-decoration-none"
                >

                    <span class="brand-icon">
                        <i class="bi bi-check2-square"></i>
                    </span>

                    Task Tracker

                </a>

            </div>

        </nav>

        <!-- ==============================
            MESSAGE
        ============================== -->

        <div id="message"></div>


        <!-- ==============================
            MAIN CONTENT
        ============================== -->

        <main class="container py-5">


            <!-- PAGE HEADER -->

            <div class="mb-4">

                <h1 class="page-title">
                    Task Tracker
                </h1>

                <p class="page-subtitle">
                    Create, manage and track your tasks.
                </p>

            </div>


            <div class="row g-4">


                <!-- ==============================
                    CREATE TASK
                ============================== -->

                <div class="col-lg-4">

                    <div class="card shadow-sm">

                        <div class="card-body p-4">

                            <h4 class="card-title mb-4">
                                Create Task
                            </h4>


                            <form id="task-form">

                                {% csrf_token %}
                                <!-- TITLE -->

                                <div class="mb-3">

                                    <label
                                        for="title"
                                        class="form-label"
                                    >
                                        Title
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="title"
                                        placeholder="Enter task title"
                                        required
                                    >

                                </div>


                                <!-- DESCRIPTION -->

                                <div class="mb-3">

                                    <label
                                        for="description"
                                        class="form-label"
                                    >
                                        Description
                                    </label>

                                    <textarea
                                        class="form-control"
                                        id="description"
                                        rows="4"
                                        placeholder="Describe the task"
                                    ></textarea>

                                </div>


                                <!-- STATUS -->

                                <div class="mb-4">

                                    <label
                                        for="status"
                                        class="form-label"
                                    >
                                        Status
                                    </label>

                                    <select
                                        class="form-select"
                                        id="status"
                                    >

                                        <option value="TD">
                                            To Do
                                        </option>

                                        <option value="IP">
                                            In Progress
                                        </option>

                                        <option value="D">
                                            Done
                                        </option>

                                    </select>

                                </div>


                                <!-- CREATE BUTTON -->

                                <button
                                    type="submit"
                                    class="btn btn-primary w-100"
                                >

                                    <i class="bi bi-plus-lg me-1"></i>

                                    Add Task

                                </button>

                            </form>

                        </div>

                    </div>

                </div>



                <!-- ==============================
                    TASK LIST
                ============================== -->

                <div class="col-lg-8">


                    <div
                        class="d-flex justify-content-between
                        align-items-center mb-3"
                    >

                        <h4 class="tasks-heading mb-0">
                            Your Tasks
                        </h4>


                        <button
                            class="btn btn-outline-primary btn-sm"
                            id="refresh-btn"
                        >

                            <i class="bi bi-arrow-clockwise me-1"></i>

                            Refresh

                        </button>

                    </div>


                    <div id="task-list">

                        <div class="text-center py-5">

                            <div
                                class="spinner-border text-primary"
                                role="status"
                            ></div>

                            <p class="text-muted mt-2">
                                Loading tasks...
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </main>



        <!-- ==============================
            EDIT TASK MODAL
        ============================== -->

        <div
            class="modal fade"
            id="editTaskModal"
            tabindex="-1"
            aria-hidden="true"
        >

            <div
                class="modal-dialog modal-dialog-centered"
            >

                <div class="modal-content">


                    <!-- MODAL HEADER -->

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Edit Task
                        </h5>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                        ></button>

                    </div>


                    <!-- MODAL BODY -->

                    <div class="modal-body p-4">


                        <input
                            type="hidden"
                            id="edit-task-id"
                        >


                        <!-- TITLE -->

                        <div class="mb-3">

                            <label
                                for="edit-title"
                                class="form-label"
                            >
                                Title
                            </label>

                            <input
                                type="text"
                                id="edit-title"
                                class="form-control"
                                placeholder="Enter task title"
                                required
                            >
                            <div id="edit-title-error" class="text-danger small mt-1">
                            </div>

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label
                                for="edit-description"
                                class="form-label"
                            >
                                Description
                            </label>

                            <textarea
                                id="edit-description"
                                class="form-control"
                                rows="4"
                                placeholder="Describe the task"
                            ></textarea>

                        </div>


                        <!-- STATUS -->

                        <div class="mb-3">

                            <label
                                for="edit-status"
                                class="form-label"
                            >
                                Status
                            </label>

                            <select
                                id="edit-status"
                                class="form-select"
                            >

                                <option value="TD">
                                    To Do
                                </option>

                                <option value="IP">
                                    In Progress
                                </option>

                                <option value="D">
                                    Done
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- MODAL FOOTER -->

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancel
                        </button>


                        <button
                            type="button"
                            class="btn btn-primary"
                            id="save-edit-btn"
                        >

                            <i class="bi bi-check-lg me-1"></i>

                            Save Changes

                        </button>

                    </div>

                </div>

            </div>

        </div>



    <!-- Bootstrap JavaScript -->

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        ></script>


        <!-- Custom JavaScript -->

        <script
            src="{% static 'tasks/js/app.js' %}"
        ></script>


    </body>

</html>
